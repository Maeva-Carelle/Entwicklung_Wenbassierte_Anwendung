<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Burgerservice Bestellung</title>
</head>

<body>

<header>
    <h1>Bestellung</h1>
</header>

<main>

    <section>
        <h2>Speisekarte</h2>

        <article>

            <img src="Bilder/classic burger.jpg" alt="Classic Burger" width="300">
            <h3>Classic Burger</h3>
            <p>- 7.99€ -</p>
        </article>

        <article>
            <img src="Bilder/double cheese burger.png" alt="Cheeseburger" width="300">
            <h3> double Cheeseburger</h3>
            <p>- 8.49€ -</p>
        </article>

        <article>
            <img src="Bilder/veggie burger.jpg" alt="Veggie Burger" width="300">
            <h3>Veggie Burger</h3>
            <p>- 8.99€ -</p>
        </article>

    </section>

    <form action="https://echo.hofmann-thomas.de" method="post">

        <section>
            <h2>Warenkorb</h2>

            <label for="warenkorb">Ihre Auswahl:</label>
            <br>

            <select id="warenkorb" name="warenkorb[]" multiple required>
                <option value="classicburger">Classic Burger</option>
                <option value="cheeseburger">Cheeseburger</option>
                <option value="veggieburger">Veggie Burger</option>
            </select>
        </section>

        <section>
            <h2>Lieferadresse</h2>

            <label for="adresse">Adresse:</label>
            <input type="text" id="adresse" name="adresse" placeholder="Adresse eingeben" required>
        </section>

        <br>

        <p>Gesamtpreis: 25.47€</p>

        <button type="button">Auswahl löschen</button>
        <button type="button">Alles löschen</button>

        <button type="submit">Bestellung abschicken</button>

    </form>

</main>

</body>
</html>
